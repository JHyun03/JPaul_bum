# Supabase 무료 프로젝트는 1주일 동안 아무도 안 쓰면 일시정지돼요.
# 3일마다 한 번씩 가볍게 접속해서 깨워둡니다. (config.js에 주소가 있을 때만 동작)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" public/config.js || true)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" public/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js가 비어 있어 건너뜀"; exit 0; fi
          curl -fsS "$URL/rest/v1/photo_feed?select=id&limit=1" -H "apikey: $KEY" -o /dev/null && echo "깨움 완료"
